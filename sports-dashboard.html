<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --surface-color: rgba(30, 41, 59, 0.7);
            --accent-color: #3b82f6;
            --accent-glow: rgba(59, 130, 246, 0.5);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --live-red: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(59, 130, 246, 0.15), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(239, 68, 68, 0.1), transparent 25%);
        }

        /* Glassmorphism Sidebar for Data */
        .sidebar {
            width: 350px;
            background: var(--surface-color);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            padding: 1.5rem;
            z-index: 10;
        }

        .brand {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: linear-gradient(135deg, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .matches-header {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .match-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            overflow-y: auto;
        }

        /* Custom Scrollbar */
        .match-list::-webkit-scrollbar { width: 6px; }
        .match-list::-webkit-scrollbar-track { background: transparent; }
        .match-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

        .match-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        .match-card:hover, .match-card.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent-color);
            transform: translateY(-2px);
            box-shadow: 0 4px 20px var(--accent-glow);
        }

        .match-card::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            height: 100%;
            width: 4px;
            background: var(--accent-color);
            transform: scaleY(0);
            transition: transform 0.3s ease;
        }

        .match-card.active::before {
            transform: scaleY(1);
        }

        .match-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .league-name {
            font-size: 0.75rem;
            color: var(--text-muted);
            font-weight: 600;
        }

        .live-badge {
            background: rgba(239, 68, 68, 0.15);
            color: var(--live-red);
            font-size: 0.65rem;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            font-weight: 800;
            display: flex;
            align-items: center;
            gap: 4px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.4); }
            70% { box-shadow: 0 0 0 4px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        .teams {
            font-weight: 600;
            font-size: 1rem;
            line-height: 1.4;
        }

        /* Main Content Area */
        .main-content {
            flex: 1;
            padding: 2rem;
            display: flex;
            flex-direction: column;
        }

        .player-container {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.1);
            aspect-ratio: 16 / 9;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .player-placeholder {
            color: var(--text-muted);
            text-align: center;
            font-size: 1.2rem;
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            position: absolute;
            top: 0;
            left: 0;
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        iframe.loaded {
            opacity: 1;
        }

        .match-details {
            max-width: 1200px;
            margin: 2rem auto 0;
            padding: 1.5rem;
            background: var(--surface-color);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.05);
        }

        .details-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
        }

        .details-meta {
            color: var(--text-muted);
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <aside class="sidebar">
        <div class="brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon></svg>
            HybridStream
        </div>
        <div class="matches-header">Live Matches (Mock API)</div>
        <div class="match-list" id="match-list">
            <!-- Matches will be injected here by JS -->
        </div>
    </aside>

    <main class="main-content">
        <div class="player-container" id="player-container">
            <div class="player-placeholder" id="placeholder">
                <p>Select a match from the sidebar to begin streaming</p>
                <p style="font-size: 0.8rem; margin-top: 10px; opacity: 0.7;">Waiting for media source...</p>
            </div>
            <!-- Iframe will be injected here -->
        </div>

        <div class="match-details" id="match-details" style="display: none;">
            <h2 class="details-title" id="details-title">Match Name</h2>
            <p class="details-meta" id="details-meta">Match details and stats would go here...</p>
        </div>
    </main>

    <script>
        // 1. MOCKING THE DATA LAYER (e.g. SportSRC / API-Football response)
        // In a real app, you would fetch this from your Data API endpoint.
        const mockApiData = [
            {
                id: 'm1',
                league: 'International Friendly',
                homeTeam: 'Canada',
                awayTeam: 'Morocco',
                isLive: true,
                // The media layer data: where the video actually lives
                embedUrl: 'https://daddylive.li/embed/embed.php?id=admin/ppv-canada-vs-morocco/1&player=1&source=tv2.json'
            },
            {
                id: 'm2',
                league: 'Premier League',
                homeTeam: 'Arsenal',
                awayTeam: 'Chelsea',
                isLive: true,
                embedUrl: 'https://example.com/mock-embed-1' // Dummy link
            },
            {
                id: 'm3',
                league: 'La Liga',
                homeTeam: 'Real Madrid',
                awayTeam: 'Barcelona',
                isLive: false,
                embedUrl: '' // Not live, no stream
            }
        ];

        // 2. RENDERING THE DATA TO THE UI
        const matchListEl = document.getElementById('match-list');
        const playerContainer = document.getElementById('player-container');
        const placeholder = document.getElementById('placeholder');
        const matchDetails = document.getElementById('match-details');
        const detailsTitle = document.getElementById('details-title');

        function renderMatches() {
            matchListEl.innerHTML = '';
            
            mockApiData.forEach(match => {
                const card = document.createElement('div');
                card.className = 'match-card';
                card.onclick = () => loadStream(match, card);

                card.innerHTML = `
                    <div class="match-info">
                        <span class="league-name">${match.league}</span>
                        ${match.isLive ? '<span class="live-badge">● LIVE</span>' : ''}
                    </div>
                    <div class="teams">
                        ${match.homeTeam} vs ${match.awayTeam}
                    </div>
                `;
                matchListEl.appendChild(card);
            });
        }

        // 3. HANDLING THE MEDIA LAYER (The Iframe Embed)
        function loadStream(match, cardElement) {
            // Update active state in UI
            document.querySelectorAll('.match-card').forEach(c => c.classList.remove('active'));
            cardElement.classList.add('active');

            // Update details section
            matchDetails.style.display = 'block';
            detailsTitle.textContent = \`\${match.homeTeam} vs \${match.awayTeam}\`;

            if (!match.isLive || !match.embedUrl) {
                // Clear existing iframe if any
                const existingIframe = playerContainer.querySelector('iframe');
                if(existingIframe) existingIframe.remove();
                
                placeholder.style.display = 'block';
                placeholder.innerHTML = '<p>Stream is currently unavailable or match has not started.</p>';
                return;
            }

            // Hide placeholder
            placeholder.style.display = 'none';

            // Remove existing iframe to prevent audio overlap
            const existingIframe = playerContainer.querySelector('iframe');
            if(existingIframe) existingIframe.remove();

            // Create and inject the new iframe dynamically
            const iframe = document.createElement('iframe');
            iframe.src = match.embedUrl;
            iframe.allow = "autoplay; fullscreen *; picture-in-picture *; encrypted-media";
            iframe.setAttribute('allowfullscreen', '');
            iframe.setAttribute('webkitallowfullscreen', '');
            iframe.setAttribute('mozallowfullscreen', '');
            
            // Fade in effect once loaded
            iframe.onload = () => iframe.classList.add('loaded');

            playerContainer.appendChild(iframe);
        }

        // Initialize the app
        renderMatches();
    </script>
</body>
</html>
